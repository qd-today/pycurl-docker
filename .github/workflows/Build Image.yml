name: Build Image

# 薄调用方：流水线在 _image.yml（plan → build → smoke → publish）。
# 这里只做两件事：决定什么时候跑、把 dispatch 的输入原样传下去。
#
# 这条线产出 pycurl（不含 IMPERSONATE）+ 自编 curl + Alpine OpenSSL 3.5 + ngtcp2/nghttp3：
#   镜像里不再集成 ddddocr / onnxruntime，原先 latest 与 lite-latest 的差异因此消失，
#   两者指向同一个 manifest：latest / lite-latest、<ver> / lite-<ver>。
#   wheelhouse 出口：wheelhouse / <ver>-wheelhouse。
#
# 只在两种情况下构建：
#   * workflow_dispatch —— 手动触发，默认只构建+冒烟、不发布
#   * tag 推送          —— 正式发布
# 普通 push 到 main 不构建：QEMU 架构一次全量编译以小时计，改动是否可用 dispatch 一次就能验。
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      push:
        description: '构建并通过冒烟测试后发布到 Docker Hub（不勾选则只构建+冒烟，不发布任何镜像）'
        type: boolean
        default: false
      platforms:
        description: '要构建的平台，逗号分隔不要空格；留空=默认全部 9 个。子集构建禁止发布'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）；runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      native_riscv:
        description: '用 RISE 的原生 riscv64 runner 构建 riscv64；需先在 org 安装 RISE RISC-V Runners App，否则 job 会一直排队'
        type: boolean
        default: false
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=强制不复用旧层（基准测试用）'
        type: string
        default: ''
      pycurl_version:
        description: '指定 pycurl 版本（留空 = Dockerfile 默认值 7.48.0）'
        type: string
        default: ''
      force:
        description: '强制重新构建，跳过「仅文档改动 / 同一 commit 已有成功运行」的判定'
        type: boolean
        default: false
jobs:
  image:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      # tag 推送时 github.event.inputs 全是 null，各输入退回 workflow_call 里的默认值
      line: main
      dockerfile: Dockerfile
      latest_tags: latest lite-latest
      version_prefix: ''
      lite_version_prefix: 'lite-'
      wheelhouse_tags: wheelhouse
      # loong64 依赖 ghcr.io/loong64/alpine 基座（plan.py 为它注入 BASE_IMAGE）
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/ppc64le,linux/riscv64,linux/s390x,linux/loong64
      platforms: ${{ github.event.inputs.platforms || '' }}
      push: ${{ github.event.inputs.push == 'true' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      native_riscv: ${{ github.event.inputs.native_riscv == 'true' }}
      cache_bust: ${{ github.event.inputs.cache_bust || '' }}
      pycurl_version: ${{ github.event.inputs.pycurl_version || '' }}
      force: ${{ github.event.inputs.force == 'true' }}
