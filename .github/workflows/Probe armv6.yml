name: Probe armv6
# 临时诊断：armv6 上装「真实的 pycurl wheel」会不会卡，以及 uv 版本有没有影响。
#
# 之前两版 probe 的错误：
#   1) 从 PyPI 装 pycurl —— PyPI 上没有 armv7l musllinux 的 pycurl，两组都在编译 sdist，
#      根本没测到装 wheel。
#   2) 现编 tiny wheel —— 能测 tag 判定，但不如直接用我们自己的产物真实。
#
# 这一版：只构建 wheel 出口（--target wheel，不碰 runtime），拿到真实的
# pycurl-*-musllinux_1_2_armv7l.whl，再用三个安装器分别装它。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 环境事实
        run: |
          docker run --rm --platform linux/arm/v6 alpine:3.24 sh -c '
            echo "uname -m: $(uname -m)"
            apk add -q python3 uv
            echo "apk uv: $(uv --version)"
            python3 -c "import sysconfig; print(\"python platform tag:\", sysconfig.get_platform())"
          '

      - name: 构建真实的 pycurl armv6 wheel（只取 wheel 出口）
        run: |
          mkdir -p /tmp/wheels
          docker buildx build --platform linux/arm/v6 --target wheel \
            --output type=local,dest=/tmp/wheels .
          ls -1 /tmp/wheels/

      - name: A) uv 0.11.19（alpine apk）装真实 wheel
        timeout-minutes: 6
        continue-on-error: true
        run: |
          docker run --rm --platform linux/arm/v6 -v /tmp/wheels:/w alpine:3.24 sh -c '
            apk add -q python3 uv
            echo "uv: $(uv --version)"
            start=$(date +%s)
            uv pip install --system --break-system-packages --no-cache --no-index --find-links /w "pycurl==7.49.0"
            echo "耗时: $(( $(date +%s) - start ))s"
          '
      - name: B) uv 0.13.6（官方 armv6 musl 二进制）装真实 wheel
        timeout-minutes: 6
        continue-on-error: true
        run: |
          docker run --rm --platform linux/arm/v6 -v /tmp/wheels:/w alpine:3.24 sh -c '
            apk add -q python3 curl
            curl -sSfL https://github.com/astral-sh/uv/releases/download/0.13.6/uv-arm-unknown-linux-musleabihf.tar.gz \
              | tar xz -C /usr/local/bin --strip-components=1
            echo "uv: $(uv --version)"
            start=$(date +%s)
            uv pip install --system --break-system-packages --no-cache --no-index --find-links /w "pycurl==7.49.0"
            echo "耗时: $(( $(date +%s) - start ))s"
          '
      - name: C) pip 装真实 wheel（已知可用的对照）
        timeout-minutes: 6
        run: |
          docker run --rm --platform linux/arm/v6 -v /tmp/wheels:/w alpine:3.24 sh -c '
            apk add -q python3 py3-pip
            start=$(date +%s)
            python3 -m pip install --no-cache-dir --break-system-packages --no-index --find-links /w "pycurl==7.49.0"
            echo "耗时: $(( $(date +%s) - start ))s"
          '
