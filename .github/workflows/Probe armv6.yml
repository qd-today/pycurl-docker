name: Probe armv6
# 临时诊断：armv6 上装「带 .so 的 wheel」会不会卡，以及 uv 版本是否有影响。
#
# 上一版 probe 的错误：从 PyPI 装 pycurl，但 PyPI 上没有 armv7l musllinux 的 pycurl，
# 结果两组都在编译 sdist，根本没测到「装 wheel」这件事。
#
# 这一版先在 armv6 里现编一个 armv7l 的 tiny wheel（与 pycurl 的 wheel tag 同构），
# 再用三个安装器分别装同一个 wheel，对比耗时与结果。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/setup-qemu-action@v3
      - name: 环境事实
        run: |
          docker run --rm --platform linux/arm/v6 alpine:3.24 sh -c '
            echo "uname -m: $(uname -m)"
            apk add -q python3 uv
            echo "apk uv: $(uv --version)"
            python3 -c "import sysconfig; print(\"platform tag:\", sysconfig.get_platform())"
            echo "nproc: $(nproc)"
          '
      - name: 在 armv6 容器里现编一个 armv7l 的 tiny wheel
        run: |
          mkdir -p /tmp/wb && cd /tmp/wb
          cat > setup.py <<'PY'
from setuptools import setup, Extension
setup(name="tinyext", version="1.0", ext_modules=[Extension("tinyext", ["tinyext.c"])])
PY
          printf 'int tiny_answer(void) { return 42; }\n' > tinyext.c
          docker run --rm --platform linux/arm/v6 -v /tmp/wb:/w -w /w alpine:3.24 sh -c '
            apk add -q python3 python3-dev py3-pip build-base
            python3 -m pip install -q --break-system-packages wheel setuptools
            python3 setup.py -q bdist_wheel >/dev/null 2>&1
          '
          ls -1 /tmp/wb/dist/
      - name: A) uv 0.11.19（alpine apk）装这个 wheel
        timeout-minutes: 6
        continue-on-error: true
        run: |
          docker run --rm --platform linux/arm/v6 -v /tmp/wb:/w -w /w alpine:3.24 sh -c '
            apk add -q python3 uv
            echo "uv: $(uv --version)"
            start=$(date +%s)
            uv pip install --system --break-system-packages --no-cache --find-links /w/dist tinyext
            echo "耗时: $(( $(date +%s) - start ))s"
          '
      - name: B) uv 0.13.6（官方 armv6 musl 二进制）装同一个 wheel
        timeout-minutes: 6
        continue-on-error: true
        run: |
          docker run --rm --platform linux/arm/v6 -v /tmp/wb:/w -w /w alpine:3.24 sh -c '
            apk add -q python3 curl
            curl -sSfL https://github.com/astral-sh/uv/releases/download/0.13.6/uv-arm-unknown-linux-musleabihf.tar.gz \
              | tar xz -C /usr/local/bin --strip-components=1
            echo "uv: $(uv --version)"
            start=$(date +%s)
            uv pip install --system --break-system-packages --no-cache --find-links /w/dist tinyext
            echo "耗时: $(( $(date +%s) - start ))s"
          '
      - name: C) pip 装同一个 wheel（已知可用的对照）
        timeout-minutes: 6
        run: |
          docker run --rm --platform linux/arm/v6 -v /tmp/wb:/w -w /w alpine:3.24 sh -c '
            apk add -q python3 py3-pip
            start=$(date +%s)
            python3 -m pip install --no-cache-dir --break-system-packages --no-index --find-links /w/dist tinyext
            echo "耗时: $(( $(date +%s) - start ))s"
          '
