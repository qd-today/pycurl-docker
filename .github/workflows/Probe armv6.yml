name: Probe armv6
# 临时诊断：uv 0.11.19（alpine apk）在 armv6 上装带 .so 的 wheel 会挂死。
# 这里测官方最新的 uv（0.13.6）是否已修复——如果修复，就统一用 uv，不必为 armv6 维护 pip 分支。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: docker/setup-qemu-action@v3
      - name: uv 0.11.19（alpine apk）装 pycurl —— 复现基线
        timeout-minutes: 8
        continue-on-error: true
        run: |
          docker run --rm --platform linux/arm/v6 alpine:3.24 sh -c '
            apk add -q python3 uv
            echo "uv: $(uv --version)"
            start=$(date +%s)
            uv pip install --system --break-system-packages --no-cache --no-compile-bytecode "pycurl==7.49.0"
            echo "耗时: $(( $(date +%s) - start ))s"
          '
      - name: uv 0.13.6（官方 armv6 musl 二进制）装 pycurl
        timeout-minutes: 10
        run: |
          docker run --rm --platform linux/arm/v6 alpine:3.24 sh -c '
            apk add -q python3 curl
            curl -sSfL https://github.com/astral-sh/uv/releases/download/0.13.6/uv-arm-unknown-linux-musleabihf.tar.gz \
              | tar xz -C /usr/local/bin --strip-components=1
            echo "uv: $(uv --version)"
            start=$(date +%s)
            uv pip install --system --break-system-packages --no-cache "pycurl==7.49.0"
            echo "耗时: $(( $(date +%s) - start ))s"
            python3 -c "import pycurl; print(pycurl.version)"
          '
