name: _Image (reusable)

# pycurl 两条构建线（不含 IMPERSONATE / 含 IMPERSONATE）共用的流水线。每条线每平台同时
# 产出 **wheelhouse 镜像** 与 **runtime 镜像**，逐平台冒烟，全绿且平台集合完整才分别合并
# 两套 manifest 发布。
#
# Dockerfile 的两个出口 stage：
#   * `--target wheel`   → `FROM scratch` + `/wheels`（pycurl wheel、SHA256SUMS、
#                          system-packages.txt、PEP 503 索引）。镜像本身就是 wheel 的载体：
#                          按 digest 推送，使用者 `docker build --mount=from=<tag>` 即可取用。
#   * `--target runtime` → `alpine` + Python 3.14 + 已装好的 pycurl（里面**没有** /wheels）。
#
# 阶段划分（与 onnxruntime-docker 一致的四段解耦）：
#   1) plan   ：算出构建分组、冒烟矩阵、平台全集与「是否全量」，下游只吃 outputs
#   2) build  ：每个架构组一个 job，一次编译两个出口（build 阶段共享，不重复编译）；
#               发布模式两个出口各自 push-by-digest（不产任何中间 tag）
#   3) smoke  ：每个平台一个 job，**直接跑 runtime 镜像**，验的是使用者拿到的那个镜像本身
#   4) publish：全部构建 + 全部冒烟通过、且平台集合完整，才合并 manifest；同一条线的
#               滚动 tag 与 lite 别名用一次 imagetools create 挂到同一个 manifest 上
on:
  workflow_call:
    inputs:
      line:
        description: '构建线标识（main / ja3），仅用于缓存 scope 与日志'
        type: string
        required: true
      dockerfile:
        description: '该线的 Dockerfile'
        type: string
        required: true
      latest_tags:
        description: '滚动 tag，空格分隔；多个别名指向同一个 manifest'
        type: string
        required: true
      version_prefix:
        description: '版本 tag 前缀，main 为空串，ja3 为 ja3-'
        type: string
        required: true
      lite_version_prefix:
        description: 'lite 版本 tag 前缀，main 为 lite-，ja3 为 ja3-lite-'
        type: string
        required: true
      wheelhouse_tags:
        description: 'wheelhouse 的滚动 tag，如 wheelhouse / ja3-wheelhouse'
        type: string
        required: true
      default_platforms:
        description: '该线的默认平台集合（逗号分隔）'
        type: string
        required: true
      platforms:
        description: '平台子集（空 = 用 default_platforms）。子集禁止发布'
        type: string
        default: ''
      push:
        description: '构建并冒烟通过后是否发布（tag 推送恒为发布）'
        type: boolean
        default: false
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）'
        type: boolean
        default: true
      native_riscv:
        description: '用 RISE 的原生 riscv64 runner 构建 riscv64（需先在 org 安装 RISE RISC-V Runners App）'
        type: boolean
        default: false
      alpine_version:
        description: 'alpine 版本，决定 loong64 的基座 tag 与 wheel 的 cpXX tag'
        type: string
        default: '3.24'
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=不复用旧层'
        type: string
        default: ''
      pycurl_version:
        description: '覆盖 Dockerfile 中的 PYCURL_VERSION（留空 = 用默认值）'
        type: string
        default: ''
      force:
        description: '强制重新构建（默认会跳过「仅文档改动」或「该 commit 已验证过」的重复运行）'
        type: boolean
        default: false
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

env:
  PUBLISH: ${{ inputs.push || startsWith(github.ref, 'refs/tags/') }}
  IMAGE: docker.io/a76yyyy/pycurl
  # loong64 专用基座：alpine 官方无此架构
  LOONG64_BASE: ghcr.io/loong64/alpine

jobs:
  plan:
    runs-on: ubuntu-latest
    name: Plan
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      smoke_matrix: ${{ steps.plan.outputs.smoke_matrix }}
      expected: ${{ steps.plan.outputs.expected }}
      groups: ${{ steps.plan.outputs.groups }}
      full: ${{ steps.plan.outputs.full }}
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether a rebuild is needed
        # 只在 workflow_dispatch 下生效：tag 推送是正式发布，必须全量构建。两种情况跳过：
        #   1) 同一 commit 已有该线的成功运行（重复 dispatch）
        #   2) 与上次成功运行相比，改动里没有任何影响镜像的路径（例如只改了 README）
        # 影响镜像的路径：Dockerfile、patches/、src/、tests/、system-packages.txt、
        # CI 自身（改了 CI 就应该重新验证一次）
        id: changes
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) ;;
            *) echo "skip=false" >> "$GITHUB_OUTPUT"; echo "reason=release-event"; exit 0 ;;
          esac
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "reason=forced"; exit 0
          fi
          base=$(gh run list --workflow "${GITHUB_WORKFLOW}" --branch "${GITHUB_REF_NAME}" \
                   --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "null" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "reason=no-previous-success"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" || true)
          echo "基准 ${base}..${GITHUB_SHA} 的改动："
          if [ -z "$changed" ]; then
            echo "  （无改动，该 commit 已验证过）"
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=already-verified"; exit 0
          fi
          echo "$changed" | sed 's/^/  /'
          relevant=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              patches/*|src/*|tests/*|system-packages.txt)
                relevant=1 ;;
              .github/workflows/_image.yml|.github/workflows/scripts/*)
                relevant=1 ;;
              ".github/workflows/${WORKFLOW_NAME}.yml")
                relevant=1 ;;
              "$DOCKERFILE")
                relevant=1 ;;
            esac
          done <<EOF
          $changed
          EOF
          if [ "$relevant" = "1" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "reason=line-inputs-changed"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "reason=unrelated-to-this-line"
          fi
      - name: Compute matrices
        id: plan
        env:
          PLATFORM_INPUT: ${{ inputs.platforms }}
          DEFAULT_PLATFORMS: ${{ inputs.default_platforms }}
          NATIVE_ARM: ${{ inputs.native_arm && 'true' || 'false' }}
          NATIVE_RISCV: ${{ inputs.native_riscv && 'true' || 'false' }}
          LINE: ${{ inputs.line }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          ALPINE: ${{ inputs.alpine_version }}
        run: |
          # 矩阵逻辑在 .github/workflows/scripts/plan.py，这里只负责落到 $GITHUB_OUTPUT
          set -euo pipefail
          python3 .github/workflows/scripts/plan.py > /tmp/plan.out
          echo "--- 构建矩阵 ---"
          sed -n 's/^matrix=//p' /tmp/plan.out | python3 -m json.tool
          echo "--- 冒烟矩阵 ---"
          sed -n 's/^smoke_matrix=//p' /tmp/plan.out | python3 -m json.tool
          echo "--- 其余 ---"
          grep -Ev '^(matrix|smoke_matrix)=' /tmp/plan.out
          cat /tmp/plan.out >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: Build ${{ matrix.group }} (${{ matrix.platforms }})
    # 仅文档改动或该 commit 已验证过时跳过（tag 发布不会被跳过）
    if: ${{ needs.plan.outputs.skip != 'true' }}
    runs-on: ${{ matrix.runner }}
    # QEMU 架构要模拟全量编译 curl（ja3 线还要再加 BoringSSL 与 nghttp3/ngtcp2），
    # 给到 GitHub 单 job 上限附近，避免慢架构被超时误杀
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard - dockerfile exposes both exits
        # 双出口流水线要求 Dockerfile 同时有 `wheel` 与 `runtime` stage，缺一个时 buildx
        # 只会报 "target stage ... could not be found"，看不懂；这里提前给出明确错误
        env:
          DOCKERFILE: ${{ matrix.file }}
        run: |
          set -euo pipefail
          for stage in wheel runtime; do
            if ! grep -qE "^FROM[[:space:]].*[[:space:]]AS[[:space:]]+${stage}[[:space:]]*$" "$DOCKERFILE"; then
              echo "::error::${DOCKERFILE} 没有 \`AS ${stage}\` 出口 stage，双出口流水线无法构建。"
              exit 1
            fi
          done
          echo "出口 stage 齐全（wheel + runtime）"
      - name: Set up QEMU
        # 组内跨架构平台（arm 组的 armv7/armv6、x86 组的 386 等）需要 binfmt
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Compose build args
        id: args
        # 只在非空时传 PYCURL_VERSION：直接传空串会把 Dockerfile 里的默认值覆盖成空，
        # 变成 `pip install "pycurl=="`。build 与 smoke 必须产出完全相同的 build-args，
        # 否则缓存 scope 命中不了，冒烟阶段会退化成全量重编译
        env:
          V: ${{ inputs.pycurl_version }}
          A: ${{ inputs.alpine_version }}
          BASE_IMAGE: ${{ matrix.base_image }}
        run: |
          set -euo pipefail
          {
            echo "args<<__BUILD_ARGS__"
            [ -z "$V" ] || echo "PYCURL_VERSION=$V"
            [ -z "$A" ] || echo "ALPINE_VERSION=$A"
            [ -z "$BASE_IMAGE" ] || echo "BASE_IMAGE=$BASE_IMAGE"
            echo "__BUILD_ARGS__"
          } >> "$GITHUB_OUTPUT"
          echo "构建参数：PYCURL_VERSION=${V:-<默认>} ALPINE_VERSION=${A:-<默认>} BASE_IMAGE=${BASE_IMAGE:-<默认>}"
      - name: Build wheelhouse image
        id: wheelhouse
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.file }}
          # 只到 wheel 阶段：产物就是这个 scratch 镜像里的 /wheels
          target: wheel
          platforms: ${{ matrix.platforms }}
          # 发布模式按 digest 推送：各架构组并行构建，用 digest 传递产物不必协调 tag 命名。
          # 推送开关写在 outputs 里（push=true），这样只有一条 --output，不会出现
          # 「--push 又叠加一个 type=image」的二义性。
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=local,dest=./dist' }}
          build-args: ${{ steps.args.outputs.args }}
          # 不产 attestation 清单，保持 manifest 只有平台条目（旧客户端兼容）
          provenance: false
          cache-from: type=gha,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}${{ inputs.cache_bust }},ignore-error=true
      - name: Build runtime image
        if: env.PUBLISH == 'true'
        id: runtime
        # 只在发布模式构建：非发布模式下冒烟 job 会自己 `--load` 出来跑，避免同一台
        # runner 上编译两遍（build 阶段仍然从缓存命中）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.file }}
          target: runtime
          platforms: ${{ matrix.platforms }}
          outputs: ${{ format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}
          build-args: ${{ steps.args.outputs.args }}
          provenance: false
          cache-from: |
            type=gha,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}${{ inputs.cache_bust }}
            type=gha,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}-runtime${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}-runtime${{ inputs.cache_bust }},ignore-error=true
      - name: Show wheelhouse
        if: env.PUBLISH != 'true'
        # 多平台 local 导出会按平台分目录（dist/linux_amd64/wheels/…），单平台则直接是
        # dist/wheels/…，所以这里用 find 而不是写死路径
        run: |
          set -euo pipefail
          find dist -name '*.whl' | sort
          find dist -name SHA256SUMS -exec cat {} \;
          find dist -name system-packages.txt -exec cat {} \;
      - name: Export digests
        if: env.PUBLISH == 'true'
        # 两个出口各一个 digest，分开目录存放，下游 publish 才能把两套 manifest 分清
        run: |
          set -eu
          mkdir -p /tmp/digests/wheelhouse /tmp/digests/runtime
          echo "${{ steps.wheelhouse.outputs.digest }}" > "/tmp/digests/wheelhouse/${{ matrix.group }}.digest"
          echo "${{ steps.runtime.outputs.digest }}" > "/tmp/digests/runtime/${{ matrix.group }}.digest"
          echo "wheelhouse ${{ matrix.group }}: $(cat "/tmp/digests/wheelhouse/${{ matrix.group }}.digest")"
          echo "runtime    ${{ matrix.group }}: $(cat "/tmp/digests/runtime/${{ matrix.group }}.digest")"
      - name: Upload wheelhouse digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-wheelhouse-${{ matrix.group }}
          path: /tmp/digests/wheelhouse/*.digest
          retention-days: 1
          if-no-files-found: error
      - name: Upload runtime digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digest-runtime-${{ matrix.group }}
          path: /tmp/digests/runtime/*.digest
          retention-days: 1
          if-no-files-found: error
      - name: Upload wheelhouse
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          # artifact 名带架构组，避免多组互相覆盖；内容是 dist 整棵树
          # （多平台导出会按平台分子目录）
          name: wheelhouse-${{ inputs.line }}-${{ matrix.group }}
          path: dist
          retention-days: 1
          if-no-files-found: error

  # 每个平台一个 job：直接跑使用者拿到的那个 runtime 镜像。
  # 与构建解耦后，构建失败与运行时失败是两种独立信号，产物也能单独构建用于调试
  smoke:
    needs: [plan, build]
    name: Smoke ${{ matrix.platform }} (${{ inputs.line }})
    runs-on: ${{ matrix.runner }}
    # 本机架构是秒级；QEMU 下 import + TLS 握手要放大十几倍，留足余量
    timeout-minutes: 90
    if: ${{ needs.plan.outputs.skip != 'true' && needs.build.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.smoke_matrix) }}
    steps:
      - name: Checkout
        # 冒烟脚本本体在仓库里（tests/smoke.py），经 stdin 喂进容器执行
        uses: actions/checkout@v4
      - name: Set up QEMU
        # 冒烟容器要按目标架构真跑（riscv64 / loong64 在 x86 runner 上全靠 binfmt）
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: env.PUBLISH != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Compose build args
        if: env.PUBLISH != 'true'
        id: args
        env:
          V: ${{ inputs.pycurl_version }}
          A: ${{ inputs.alpine_version }}
          BASE_IMAGE: ${{ matrix.base_image }}
        run: |
          set -euo pipefail
          {
            echo "args<<__BUILD_ARGS__"
            [ -z "$V" ] || echo "PYCURL_VERSION=$V"
            [ -z "$A" ] || echo "ALPINE_VERSION=$A"
            [ -z "$BASE_IMAGE" ] || echo "BASE_IMAGE=$BASE_IMAGE"
            echo "__BUILD_ARGS__"
          } >> "$GITHUB_OUTPUT"
      - name: Download runtime digest
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@v4
        with:
          name: digest-runtime-${{ matrix.group }}
          path: /tmp/digest
      - name: Fetch runtime image from registry
        if: env.PUBLISH == 'true'
        # 发布模式下验的就是 registry 里那份字节，而不是构建机上残留的临时镜像
        run: |
          set -eux
          DIGEST=$(cat /tmp/digest/*.digest)
          docker pull --platform "${{ matrix.platform }}" "${IMAGE}@${DIGEST}"
          docker tag "${IMAGE}@${DIGEST}" "smoke:${{ matrix.arch }}"
          docker image inspect -f '{{.Id}}' "smoke:${{ matrix.arch }}"
      - name: Build runtime image
        if: env.PUBLISH != 'true'
        # 非发布模式没有 registry 可拉，就地按同一个 target 构建并装进本地 docker。
        # build 阶段命中 build job 导出的 gha 缓存，不会重跑编译
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.file }}
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: smoke:${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.args }}
          provenance: false
          cache-from: |
            type=gha,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}${{ inputs.cache_bust }}
            type=gha,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}-runtime${{ inputs.cache_bust }}
          cache-to: type=gha,mode=max,scope=pycurl-${{ inputs.line }}-${{ matrix.group }}-runtime${{ inputs.cache_bust }},ignore-error=true
      - name: Run smoke (${{ inputs.line }})
        env:
          PLATFORM: ${{ matrix.platform }}
          ROLE: ${{ inputs.line }}
        # smoke.py 会验：环境架构、/wheels 残留、git、pycurl 版本与 HTTP3 特性位、
        # pycurl.libs 自包含、无 OCR 栈、全部原生产物的 ELF 架构、一次真实 HTTPS 请求，
        # ja3 线再加 IMPERSONATE 与本地抓包自算的 ja3n
        run: |
          set -euo pipefail
          docker run --rm -i --platform "$PLATFORM" "smoke:${{ matrix.arch }}" \
            python3 - "$ROLE" "$PLATFORM" < tests/smoke.py

  publish:
    needs: [plan, build, smoke]
    name: Merge digests and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 闸门（fail-closed）：① 有发布意图 ② build 与 smoke 都成功（任何一个失败/取消都不发布，
    # 也不做「部分成功就先发一半」）③ 平台集合完整（见下一步）
    if: ${{ (inputs.push || startsWith(github.ref, 'refs/tags/')) && !cancelled() && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.plan.outputs.skip != 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Guard - reject partial publish
        if: ${{ needs.plan.outputs.full != 'true' }}
        run: |
          echo "::error::平台子集（${{ needs.plan.outputs.expected }}）不是该线的完整平台集合，禁止发布。"
          echo "::error::用子集发布会把多平台正式 manifest 覆盖成不完整版本。"
          echo "::error::要发布请留空 platforms 走全平台构建。"
          exit 1
      - name: Download wheelhouse digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-wheelhouse-*
          path: /tmp/digests/wheelhouse
          merge-multiple: true
      - name: Download runtime digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-runtime-*
          path: /tmp/digests/runtime
          merge-multiple: true
      - name: Guard - digest completeness
        env:
          EXPECTED_GROUPS: ${{ needs.plan.outputs.groups }}
        # artifact 跨 job 传递，缺一个架构组会静默合并出残缺 index，合并前按组数核对
        run: |
          set -euo pipefail
          want=$(printf '%s' "$EXPECTED_GROUPS" | tr ',' '\n' | grep -c .)
          for kind in wheelhouse runtime; do
            got=$(find "/tmp/digests/$kind" -name '*.digest' | grep -c . || true)
            echo "$kind: $got / $want digest"
            if [ "$got" -ne "$want" ]; then
              echo "::error::$kind 的 digest 不完整（${got} != ${want}），禁止发布"
              exit 1
            fi
          done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create multi-arch manifests
        env:
          LATEST_TAGS: ${{ inputs.latest_tags }}
          WHEELHOUSE_TAGS: ${{ inputs.wheelhouse_tags }}
          VERSION_PREFIX: ${{ inputs.version_prefix }}
          LITE_VERSION_PREFIX: ${{ inputs.lite_version_prefix }}
        # 同一条线的多个 tag 用**一次** imagetools create 挂上去：一个 manifest，多个别名。
        # 分两次 create 会得到两个内容相同但 digest 不同的 manifest，`latest` 与
        # `lite-latest` 就不再是「同一个镜像」。
        run: |
          set -euo pipefail

          merge_one() {
            dir="$1"; shift
            SRCS=""
            for f in "$dir"/*.digest; do
              SRCS="$SRCS ${IMAGE}@$(cat "$f")"
            done
            TAGS=""
            for t in "$@"; do
              TAGS="$TAGS -t ${IMAGE}:${t}"
            done
            echo "::group::合并 ${dir} ->${TAGS}"
            docker buildx imagetools create ${TAGS} ${SRCS}
            echo "::endgroup::"
          }

          # 版本 tag 只在 tag 事件产出；dispatch 时 ref_name 是分支名，推出去会污染 Hub
          VERSION_TAGS=""
          WH_VERSION_TAG=""
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            VERSION_TAGS="${VERSION_PREFIX}${GITHUB_REF_NAME} ${LITE_VERSION_PREFIX}${GITHUB_REF_NAME}"
            WH_VERSION_TAG="${VERSION_PREFIX}${GITHUB_REF_NAME}-wheelhouse"
          fi

          merge_one /tmp/digests/wheelhouse ${WHEELHOUSE_TAGS} ${WH_VERSION_TAG}
          merge_one /tmp/digests/runtime ${LATEST_TAGS} ${VERSION_TAGS}

          ALL_TAGS="${WHEELHOUSE_TAGS} ${LATEST_TAGS} ${VERSION_TAGS} ${WH_VERSION_TAG}"
          ALL_TAGS=$(printf '%s\n' ${ALL_TAGS} | awk '!seen[$0]++' | tr '\n' ' ')
          echo "TAGS=${ALL_TAGS}" >> "$GITHUB_ENV"
          echo "最终标签：${ALL_TAGS}"
      - name: Verify manifest platform completeness
        env:
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -euo pipefail
          python3 .github/workflows/scripts/verify_manifests.py
