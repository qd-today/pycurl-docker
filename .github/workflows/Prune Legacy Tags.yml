name: Prune Legacy Tags

# 一次性运维工具：按前缀删除 Docker Hub 上某个仓库的历史 tag。
# 只支持手动触发；默认 dry_run=true，仅列出将删除的 tag。
# Docker Hub 没有「删除 tag」的 CLI 命令，只能走 Hub API，
# 而 Hub API 需要账号凭据，因此借用仓库已有的 DOCKER_USERNAME / DOCKER_PASSWORD secrets。

on:
  workflow_dispatch:
    inputs:
      hub_repo:
        description: 'Docker Hub 仓库（namespace/name）'
        type: string
        required: true
        default: 'a76yyyy/pycurl'
      tag_prefix:
        description: '要删除的 tag 前缀（如 default-，不可为空）'
        type: string
        required: true
        default: 'default-'
      dry_run:
        description: '仅列出将删除的 tag，不实际删除'
        type: boolean
        default: true

jobs:
  prune:
    name: Prune ${{ github.event.inputs.tag_prefix }}*
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete matching tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          HUB_REPO: ${{ github.event.inputs.hub_repo }}
          TAG_PREFIX: ${{ github.event.inputs.tag_prefix }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          API = "https://hub.docker.com/v2"
          REPO = os.environ["HUB_REPO"].strip()
          PREFIX = os.environ["TAG_PREFIX"].strip()
          DRY_RUN = os.environ.get("DRY_RUN", "true").strip().lower() == "true"

          if not PREFIX:
              sys.exit("::error::tag_prefix 不能为空")
          if not REPO or "/" not in REPO:
              sys.exit("::error::hub_repo 必须是 namespace/name 形式")


          def call(url, data=None, token=None, method=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(
                  url, data=body, method=method or ("POST" if body else "GET"))
              req.add_header("Content-Type", "application/json")
              req.add_header("Accept", "application/json")
              if token:
                  req.add_header("Authorization", "JWT " + token)
              return urllib.request.urlopen(req)


          token = json.load(call(API + "/users/login/", {
              "username": os.environ["DOCKER_USERNAME"],
              "password": os.environ["DOCKER_PASSWORD"],
          }))["token"]

          tags, page = [], 1
          while True:
              payload = json.load(call(
                  "%s/repositories/%s/tags/?page_size=100&page=%d" % (API, REPO, page),
                  token=token))
              tags += [r["name"] for r in payload.get("results", [])]
              if not payload.get("next"):
                  break
              page += 1

          targets = sorted(t for t in tags if t.startswith(PREFIX))
          print("仓库 %s 共 %d 个 tag，匹配 %r 的 %d 个：" % (REPO, len(tags), PREFIX, len(targets)))
          for name in targets:
              print("  -", name)

          if not targets:
              print("没有需要删除的 tag")
              sys.exit(0)
          if DRY_RUN:
              print("dry_run=true，未删除任何内容")
              sys.exit(0)

          failed = []
          for name in targets:
              try:
                  resp = call("%s/repositories/%s/tags/%s/" % (API, REPO, name),
                              token=token, method="DELETE")
                  print("deleted %s -> HTTP %s" % (name, resp.status))
              except urllib.error.HTTPError as exc:
                  print("FAILED %s -> HTTP %s %s" % (name, exc.code, exc.read()[:200]))
                  failed.append(name)

          if failed:
              sys.exit("::error::%d 个 tag 删除失败: %s" % (len(failed), ", ".join(failed)))
          print("全部删除完成")
          PY
