name: Publish Ja3 Package
on:
  push:
    paths:
      - 'Dockerfile.ja3'
      - 'patches/**'
      - '.github/workflows/Publish Ja3 Package.yml'
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Publish Package job
    if: startsWith(github.repository, 'qiandao-today/pycurl-docker')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/qiandao-today/pycurl-docker
          flavor: |
            latest=false
          tags: |
            type=raw,value=ja3-latest
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ja3
          platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
