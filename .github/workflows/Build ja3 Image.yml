name: Build Ja3 Image

# 薄调用方：流水线在 _image.yml（plan → build → smoke → publish）。
#
# 这条线产出 pycurl（含 IMPERSONATE）+ curl-impersonate + BoringSSL：
#   镜像里不再集成 ddddocr / onnxruntime，原先 ja3 与 ja3-lite 的差异因此消失，
#   两者指向同一个 manifest：ja3-latest / ja3-lite-latest、ja3-<ver> / ja3-lite-<ver>。
#   wheelhouse 出口：ja3-wheelhouse / ja3-<ver>-wheelhouse。
#
# 平台范围由 BoringSSL 决定：官方 target 清单只有 x86 / x86_64 / aarch64 / arm / riscv64 等，
# 所以不含 ppc64le、s390x、loong64。
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      push:
        description: '构建并通过冒烟测试后发布到 Docker Hub（不勾选则只构建+冒烟，不发布任何镜像）'
        type: boolean
        default: false
      platforms:
        description: '要构建的平台，逗号分隔不要空格；留空=默认全部 6 个。子集构建禁止发布'
        type: string
        default: ''
      native_arm:
        description: '用 GitHub 原生 arm64 runner 构建 arm64（比 QEMU 快一个数量级）；runner 不可用时取消勾选回退 QEMU'
        type: boolean
        default: true
      native_riscv:
        description: '用 RISE 的原生 riscv64 runner 构建 riscv64；需先在 org 安装 RISE RISC-V Runners App，否则 job 会一直排队'
        type: boolean
        default: false
      cache_bust:
        description: '缓存 scope 后缀。留空=复用缓存；填任意值=强制不复用旧层（基准测试用）'
        type: string
        default: ''
      pycurl_version:
        description: '指定 pycurl 版本（留空 = Dockerfile 默认值 7.48.0）'
        type: string
        default: ''
      force:
        description: '强制重新构建，跳过「仅文档改动 / 同一 commit 已有成功运行」的判定'
        type: boolean
        default: false
jobs:
  image:
    uses: ./.github/workflows/_image.yml
    secrets: inherit
    with:
      line: ja3
      dockerfile: Dockerfile.ja3
      latest_tags: ja3-latest ja3-lite-latest
      version_prefix: 'ja3-'
      lite_version_prefix: 'ja3-lite-'
      wheelhouse_tags: ja3-wheelhouse
      default_platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7,linux/riscv64
      platforms: ${{ github.event.inputs.platforms || '' }}
      push: ${{ github.event.inputs.push == 'true' }}
      native_arm: ${{ github.event.inputs.native_arm != 'false' }}
      native_riscv: ${{ github.event.inputs.native_riscv == 'true' }}
      cache_bust: ${{ github.event.inputs.cache_bust || '' }}
      pycurl_version: ${{ github.event.inputs.pycurl_version || '' }}
      force: ${{ github.event.inputs.force == 'true' }}
