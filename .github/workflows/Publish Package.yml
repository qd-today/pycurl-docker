name: Publish Latest Package
on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/Publish Package.yml'
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    name: Publish Package job
    if: startsWith(github.repository, 'qiandao-today/pycurl-docker')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # 五平台含 386/arm/v6/arm/v7，runner 仅 amd64 本机，必须注册 QEMU 二进制翻译，
      # 否则非本机平台的 RUN 步骤直接 exec format error
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/qiandao-today/pycurl-docker
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/386,linux/arm64,linux/amd64,linux/arm/v6,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
